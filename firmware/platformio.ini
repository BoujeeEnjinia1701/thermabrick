; ThermaBrick test article controller. Build: pio run; flash: pio run -t upload;
; host unit tests: pio test -e native. Licensed MIT (see LICENSE-SOFTWARE).
[platformio]
default_envs = esp32dev

[env]
build_flags = -Wall

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/git_rev.py
test_ignore = *

; Adds the /inject endpoint for TBK-TST-001 TP1 step 5. Never use for heated tests.
[env:esp32dev_test]
extends = env:esp32dev
build_flags = ${env.build_flags} -DTB_TEST_INJECT

[env:native]
platform = native
test_build_src = no
